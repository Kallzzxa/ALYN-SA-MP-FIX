name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALYN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/alyn-release.keystore
          echo "ALYN_KEYSTORE_PATH=$RUNNER_TEMP/alyn-release.keystore" >> $GITHUB_ENV

      - name: Build release APK
        env:
          ALYN_STORE_PASSWORD: ${{ secrets.ALYN_STORE_PASSWORD }}
          ALYN_KEY_ALIAS: ${{ secrets.ALYN_KEY_ALIAS }}
          ALYN_KEY_PASSWORD: ${{ secrets.ALYN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alyn-fix-release-apk
          path: app/build/outputs/apk/release/*.apk
